name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: self-hosted

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify Cluster
      run: |
        kubectl get nodes

    - name: Restart Deployment
      run: |
        kubectl rollout restart deployment/flask-app -n dev

    - name: Verify Rollout
      run: |
        kubectl rollout status deployment/flask-app -n dev
